# Hive-connector catalog used ONLY as a staging area for Dataiku's Trino "Automatic fast-write".
# DSS writes Parquet files to s3://dataiku/trino-staging/, Trino creates a temporary external table
# over them here, copies the rows into the Iceberg target (INSERT ... SELECT) and drops the table.
# No real data lives in this catalog. Table definitions are kept by the file metastore in Minio
# (no Hive Metastore container needed).
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://dataiku/hive-metastore/

# Trino reads the staged files from Minio directly over the compose network
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
