services:
  # 1. The Minio server (no volume: data is discarded on `docker compose down`)
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console (UI)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The bucket initializer (runs once then exits)
  minio-init:
    image: quay.io/minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/dataiku &&
      echo 'Bucket dataiku created successfully'
      "

  # 3. The metadata database (no volume: catalog metadata is discarded on `docker compose down`)
  polaris-db:
    image: postgres:16
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. The bootstrap tool (runs once then exits)
  polaris-bootstrap:
    image: apache/polaris-admin-tool:latest
    command: ["bootstrap", "--realm=POLARIS", "--credential=POLARIS,root,${POLARIS_ROOT_SECRET:-s3cr3t}"]
    environment:
      - POLARIS_PERSISTENCE_TYPE=relational-jdbc
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://polaris-db:5432/polaris
      - QUARKUS_DATASOURCE_USERNAME=polaris
      - QUARKUS_DATASOURCE_PASSWORD=password
    depends_on:
      polaris-db:
        condition: service_healthy

  # 5. The Polaris server
  polaris:
    image: apache/polaris:latest
    ports:
      - "8181:8181" # REST API
      - "8182:8182" # Management/Health
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      polaris-bootstrap:
        condition: service_completed_successfully
    environment:
      - POLARIS_PERSISTENCE_TYPE=relational-jdbc
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://polaris-db:5432/polaris
      - QUARKUS_DATASOURCE_USERNAME=polaris
      - QUARKUS_DATASOURCE_PASSWORD=password
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      # Lab-only feature flags (change for prod!)
      - POLARIS_FEATURES_ALLOW_INSECURE_STORAGE_TYPES=true
      - POLARIS_FEATURES_DROP_WITH_PURGE_ENABLED=true
      - POLARIS_FEATURES_ALLOW_OVERLAPPING_CATALOG_URLS=true
      - POLARIS_FEATURES_ALLOW_NAMESPACE_CUSTOM_LOCATION=true

  # 6. The Polaris setup worker (runs once then exits)
  # Host networking lets it detect the host IP that Minio is reachable on.
  # Optionally export HOST_IP to override the detection.
  polaris-setup-worker:
    image: curlimages/curl:latest
    user: root
    network_mode: "host"
    environment:
      - S3_REGION=us-east-1
      - HOST_IP=${HOST_IP:-}
      - POLARIS_ROOT_SECRET=${POLARIS_ROOT_SECRET:-s3cr3t}
    volumes:
      - ./setup.sh:/usr/local/bin/setup.sh:ro
      - ./:/out # polaris_creds.env is written here
    depends_on:
      - polaris
    entrypoint: ["/bin/sh", "/usr/local/bin/setup.sh"]
